name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Tests, lint & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1, luacheck, xmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks build-essential libxml2-utils
          sudo luarocks --lua-version=5.1 install luacheck

      # Hard gate: every non-library Lua file must compile under Lua 5.1
      # (this is the "WoW will load it" check). UTF-8 BOM is stripped first
      # because the standalone luac5.1 rejects it, while WoW handles it natively.
      - name: luac5.1 syntax check
        run: |
          fail=0
          while IFS= read -r f; do
            tmp="$(mktemp)"
            sed '1s/^\xEF\xBB\xBF//' "$f" > "$tmp"
            if ! luac5.1 -p "$tmp"; then
              echo "::error file=$f::luac5.1 syntax error"
              fail=1
            fi
            rm -f "$tmp"
          done < <(git ls-files '*.lua' | grep -v '^Libs/')
          exit $fail

      # Hard gate: every non-library XML file must be well-formed.
      - name: XML well-formedness
        run: |
          fail=0
          while IFS= read -r f; do
            if ! xmllint --noout "$f"; then
              echo "::error file=$f::malformed XML"
              fail=1
            fi
          done < <(git ls-files '*.xml' | grep -v '^Libs/')
          exit $fail

      # Hard gate: the secret-value linter must itself be sound. It checks
      # both directions -- every violation shape caught, every guard shape
      # honoured -- and re-runs each "clean" fixture with its guard stripped,
      # so a linter that quietly stopped detecting anything fails here rather
      # than reporting a reassuring zero.
      - name: Secret-value linter self-test
        run: python3 Tools/test_lint_secret_values.py

      # Hard gate on *new* debt only. Tools/secret_baseline.txt records the
      # unguarded uses that already existed; anything not in it fails the
      # build. Shrink the baseline as the entries get fixed, never grow it.
      - name: Secret-value audit
        run: python3 Tools/lint_secret_values.py --baseline Tools/secret_baseline.txt

      - name: Execute Lua and Python regression tests
        run: python3 Tools/run_tests.py --lua lua5.1

      - name: Validate installed TOC and XML load graph
        run: python3 Tools/build_release.py --check

      # Hard gate: missing values, uninitialized locals and invalid control flow.
      # The remaining lint backlog remains visible in the advisory step below.
      - name: Critical Lua diagnostics
        run: luacheck . --only 221 321 511 512 521 531

      # Advisory for now: surfaces the static-analysis backlog without failing
      # the build. Flip `continue-on-error` to false once the backlog is cleared
      # to make luacheck a hard gate too.
      - name: luacheck
        continue-on-error: true
        run: luacheck .
